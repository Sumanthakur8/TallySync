<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GST Calculator — TallySync</title><meta name="description" content="Calculate GST and split CGST, SGST or IGST."><link rel="stylesheet" href="tool.css"></head><body><header class="nav"><div class="wrap"><a class="brand" href="index.html">Tally<span>Sync</span> by Suman</a><nav class="navlinks"><a href="all-tools.html">All Tools</a><a href="index.html#services">Services</a><a class="btn primary" href="index.html#converter">Bank Converter</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">GST Tools</div><h1>GST Calculator</h1><p>Calculate GST-inclusive or GST-exclusive amounts and split the tax for intra-state or inter-state transactions.</p></section><section class="card"><div class="grid"><div class="field"><label>Amount</label><input class="input" id="amount" type="number" value="10000"></div><div class="field"><label>GST rate (%)</label><select class="select" id="rate"><option>0</option><option>5</option><option>12</option><option selected>18</option><option>28</option></select></div><div class="field"><label>Amount type</label><select class="select" id="type"><option value="exclusive">GST extra</option><option value="inclusive">GST included</option></select></div><div class="field"><label>Supply type</label><select class="select" id="supply"><option value="intra">Intra-state (CGST + SGST)</option><option value="inter">Inter-state (IGST)</option></select></div></div><div class="actions"><button class="btn primary" onclick="calc()">Calculate GST</button><button class="btn ghost" onclick="location.reload()">Reset</button></div><div id="result" class="result"></div></section><script>function calc(){let a=num('amount'),r=num('rate'),t=document.getElementById('type').value,s=document.getElementById('supply').value,g=a*r/100,base=a,total=a+g;if(t==='inclusive'){base=a/(1+r/100);g=a-base;total=a}let half=g/2;document.getElementById('result').innerHTML='<h3>Result</h3><div class="grid3"><div><small>Taxable value</small><div class="metric">'+money(base)+'</div></div><div><small>'+ (s==='intra'?'CGST + SGST':'IGST') +'</small><div class="metric">'+money(g)+'</div></div><div><small>Total invoice value</small><div class="metric">'+money(total)+'</div></div></div>'+(s==='intra'?'<p class="muted">CGST: '+money(half)+' · SGST: '+money(half)+'</p>':'<p class="muted">IGST: '+money(g)+'</p>')+'</div>'}calc();</script></main><footer class="footer">© 2026 TallySync by Suman · Browser-based accounting tools</footer><script src="tools.js"></script></body></html>
