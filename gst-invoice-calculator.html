<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GST Invoice Calculator — TallySync</title><meta name="description" content="Calculate line-item GST totals for an invoice."><link rel="stylesheet" href="tool.css"></head><body><header class="nav"><div class="wrap"><a class="brand" href="index.html">Tally<span>Sync</span> by Suman</a><nav class="navlinks"><a href="all-tools.html">All Tools</a><a href="index.html#services">Services</a><a class="btn primary" href="index.html#converter">Bank Converter</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">GST Tools</div><h1>GST Invoice Calculator</h1><p>Add invoice items with quantity, price and GST rate. Totals update instantly.</p></section><section class="card"><table class="table"><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>GST %</th><th>Total</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="actions"><button class="btn ghost" onclick="addRow()">+ Add item</button></div><div id="totals" class="result"></div></section><script>let n=0;function addRow(){n++;let tr=document.createElement('tr');tr.id='r'+n;tr.innerHTML='<td><input class="input" value="Item '+n+'"></td><td><input class="input q" type="number" value="1" min="0"></td><td><input class="input p" type="number" value="1000" min="0"></td><td><select class="select g"><option>0</option><option>5</option><option>12</option><option selected>18</option><option>28</option></select></td><td class="line">₹0.00</td><td><button class="btn ghost" onclick="this.closest('tr').remove();calc()">×</button></td>';document.getElementById('rows').appendChild(tr);tr.querySelectorAll('input,select').forEach(e=>e.oninput=calc);calc()}function calc(){let base=tax=0;document.querySelectorAll('#rows tr').forEach(tr=>{let q=+tr.querySelector('.q').value||0,p=+tr.querySelector('.p').value||0,g=+tr.querySelector('.g').value||0,b=q*p,x=b*g/100;base+=b;tax+=x;tr.querySelector('.line').textContent=money(b+x)});set('totals','Taxable value: '+money(base)+' · GST: '+money(tax)+' · Grand total: '+money(base+tax))}addRow();addRow();</script></main><footer class="footer">© 2026 TallySync by Suman · Browser-based accounting tools</footer><script src="tools.js"></script></body></html>
