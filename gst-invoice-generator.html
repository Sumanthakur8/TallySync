<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GST Invoice Generator — TallySync</title><meta name="description" content="Create and print a GST invoice in the browser."><link rel="stylesheet" href="tool.css"></head><body><header class="nav"><div class="wrap"><a class="brand" href="index.html">Tally<span>Sync</span> by Suman</a><nav class="navlinks"><a href="all-tools.html">All Tools</a><a href="index.html#services">Services</a><a class="btn primary" href="index.html#converter">Bank Converter</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">GST Tools</div><h1>GST Invoice Generator</h1><p>Enter seller, buyer and item details, then print or save the finished invoice as PDF using your browser’s print dialog.</p></section><section class="card"><div class="grid"><div class="field"><label>Seller</label><input class="input" id="seller" value="Prime GST & Tax Solutions"></div><div class="field"><label>Seller GSTIN</label><input class="input" id="sgst" placeholder="GSTIN"></div><div class="field"><label>Buyer</label><input class="input" id="buyer" placeholder="Customer name"></div><div class="field"><label>Buyer GSTIN</label><input class="input" id="bgst" placeholder="GSTIN"></div><div class="field"><label>Invoice number</label><input class="input" id="inv" value="INV-001"></div><div class="field"><label>Date</label><input class="input" id="date" type="date"></div></div><div class="actions"><button class="btn primary" onclick="add()">+ Add item</button><button class="btn ghost" onclick="printInvoice()">Print / Save PDF</button></div><div id="items"></div><div id="invoice" class="result"></div></section><script>let items=[];document.getElementById('date').value=new Date().toISOString().slice(0,10);function add(){items.push({name:'Service',qty:1,rate:1000,gst:18});render()}function render(){document.getElementById('items').innerHTML=items.map((x,i)=>'<div class="grid" style="margin-top:12px"><div><input class="input" value="'+x.name+'" oninput="items['+i+'].name=this.value;calc()"></div><div><input class="input" type="number" value="'+x.qty+'" oninput="items['+i+'].qty=+this.value;calc()"></div><div><input class="input" type="number" value="'+x.rate+'" oninput="items['+i+'].rate=+this.value;calc()"></div><div><select class="select" onchange="items['+i+'].gst=+this.value;calc()"><option>0</option><option>5</option><option>12</option><option selected>18</option><option>28</option></select></div></div>').join('');calc()}function calc(){let sub=items.reduce((s,x)=>s+x.qty*x.rate,0),tax=items.reduce((s,x)=>s+x.qty*x.rate*x.gst/100,0);document.getElementById('invoice').innerHTML='<h3>'+esc(document.getElementById('seller').value)+'</h3><p>'+esc(document.getElementById('sgst').value)+'<br>Invoice: '+esc(document.getElementById('inv').value)+' · '+esc(document.getElementById('date').value)+'</p><p>Bill To: <b>'+esc(document.getElementById('buyer').value)+'</b><br>'+esc(document.getElementById('bgst').value)+'</p><table class="table"><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>GST</th><th>Amount</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.rate)+'</td><td>'+x.gst+'%</td><td>'+money(x.qty*x.rate*(1+x.gst/100))+'</td></tr>').join('')+'</tbody></table><h3 style="text-align:right">Subtotal '+money(sub)+' · GST '+money(tax)+' · Total '+money(sub+tax)+'</h3>'}function printInvoice(){let w=window.open('','_blank');w.document.write('<html><head><title>Invoice</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body>'+document.getElementById('invoice').innerHTML+'</body></html>');w.document.close();w.print()}add();</script></main><footer class="footer">© 2026 TallySync by Suman · Browser-based accounting tools</footer><script src="tools.js"></script></body></html>
