<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSTIN Validator — TallySync</title><meta name="description" content="Validate GSTIN format and checksum."><link rel="stylesheet" href="tool.css"></head><body><header class="nav"><div class="wrap"><a class="brand" href="index.html">Tally<span>Sync</span> by Suman</a><nav class="navlinks"><a href="all-tools.html">All Tools</a><a href="index.html#services">Services</a><a class="btn primary" href="index.html#converter">Bank Converter</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">GST Tools</div><h1>GSTIN Validator</h1><p>Check the 15-character GSTIN structure and validate its checksum locally in your browser.</p></section><section class="card"><div class="field"><label>GSTIN</label><input class="input" id="gstin" maxlength="15" placeholder="22AAAAA0000A1Z5" oninput="validate()"></div><div id="result" class="result"></div></section><script>function validate(){let g=document.getElementById('gstin').value.trim().toUpperCase(),ok=/^[0-9]{2}[A-Z0-9]{10}Z[A-Z0-9]$/.test(g),msg=ok?'Format looks valid.':'Invalid GSTIN format.';if(ok){let chars='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ',sum=0;for(let i=0;i<14;i++){let code=chars.indexOf(g[i]);let f=(i%2===0)?2:1;let p=code*f;sum+=Math.floor(p/36)+(p%36)}let check=(36-sum%36)%36;ok=chars[check]===g[14];msg=ok?'GSTIN checksum is valid.':'GSTIN checksum is invalid.'}document.getElementById('result').innerHTML='<h3>'+(ok?'✓ Valid':'✕ Check required')+'</h3><p class="muted">'+msg+'</p>'+(g.length===15?'<p class="muted">State code: '+esc(g.slice(0,2))+' · PAN segment: '+esc(g.slice(2,12))+' · Entity number: '+esc(g[12])+'</p>':'')}</script></main><footer class="footer">© 2026 TallySync by Suman · Browser-based accounting tools</footer><script src="tools.js"></script></body></html>
