<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITC Calculator — TallySync</title><meta name="description" content="Calculate eligible input tax credit and net GST payable."><link rel="stylesheet" href="tool.css"></head><body><header class="nav"><div class="wrap"><a class="brand" href="index.html">Tally<span>Sync</span> by Suman</a><nav class="navlinks"><a href="all-tools.html">All Tools</a><a href="index.html#services">Services</a><a class="btn primary" href="index.html#converter">Bank Converter</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">GST Tools</div><h1>ITC Calculator</h1><p>Compare output GST with eligible input tax credit and estimate net GST payable.</p></section><section class="card"><div class="grid"><div class="field"><label>Output CGST</label><input class="input" id="oc" type="number" value="18000"></div><div class="field"><label>Output SGST</label><input class="input" id="os" type="number" value="18000"></div><div class="field"><label>Output IGST</label><input class="input" id="oi" type="number" value="0"></div><div class="field"><label>Eligible ITC CGST</label><input class="input" id="ic" type="number" value="10000"></div><div class="field"><label>Eligible ITC SGST</label><input class="input" id="is" type="number" value="10000"></div><div class="field"><label>Eligible ITC IGST</label><input class="input" id="ii" type="number" value="5000"></div></div><div class="actions"><button class="btn primary" onclick="calc()">Calculate</button></div><div id="result" class="result"></div></section><script>function calc(){let oc=num('oc'),os=num('os'),oi=num('oi'),ic=num('ic'),is=num('is'),ii=num('ii'),out=oc+os+oi,itc=ic+is+ii,net=Math.max(0,out-itc);document.getElementById('result').innerHTML='<h3>ITC summary</h3><div class="grid3"><div><small>Output GST</small><div class="metric">'+money(out)+'</div></div><div><small>Eligible ITC entered</small><div class="metric">'+money(itc)+'</div></div><div><small>Indicative net GST</small><div class="metric">'+money(net)+'</div></div></div><p class="muted">This is a simple credit-vs-output calculator; actual utilisation/order of set-off and blocked credits require transaction-level review.</p></div>}calc();</script></main><footer class="footer">© 2026 TallySync by Suman · Browser-based accounting tools</footer><script src="tools.js"></script></body></html>
