<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPG to PDF Converter — TallySync</title><meta name="description" content="Combine JPG images into a single PDF in your browser."><link rel="stylesheet" href="tool.css"></head><body><header class="nav"><div class="wrap"><a class="brand" href="index.html" aria-label="TallySync by Suman"><img class="brand-logo" src="tallysync-logo.png" alt="TallySync by Suman"></a><nav class="navlinks"><a href="all-tools.html">All Tools</a><a href="index.html#services">Services</a><a class="btn primary" href="index.html#converter">Bank Converter</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">PDF Tools</div><h1>JPG → PDF Converter</h1><p>Select one or more JPG/PNG images and combine them into one PDF. The images are processed in your browser.</p></section><section class="card"><input class="input" id="imgs" type="file" accept="image/jpeg,image/png" multiple><div class="actions"><button class="btn primary" onclick="go()">Create PDF</button></div><div id="out" class="result"></div></section><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>async function go(){let fs=[...document.getElementById('imgs').files];if(!fs.length)return alert('Select images');let {jsPDF}=window.jspdf,pdf=null;for(let i=0;i<fs.length;i++){let url=URL.createObjectURL(fs[i]),img=new Image();await new Promise(r=>{img.onload=r;img.src=url});let portrait=img.height>=img.width,w=portrait?210:297,h=portrait?297:210;if(!pdf)pdf=new jsPDF({orientation:portrait?'p':'l',unit:'mm',format:'a4'});else pdf.addPage('a4',portrait?'p':'l');let ratio=Math.min((w-10)/img.width,(h-10)/img.height),iw=img.width*ratio,ih=img.height*ratio;pdf.addImage(img,'JPEG',(w-iw)/2,(h-ih)/2,iw,ih);URL.revokeObjectURL(url)}pdf.save('images-to-pdf.pdf');document.getElementById('out').innerHTML='<b>PDF created successfully.</b>'}</script></main><footer class="footer">© 2026 TallySync by Suman · Browser-based accounting tools</footer><script src="tools.js"></script></body></html>
