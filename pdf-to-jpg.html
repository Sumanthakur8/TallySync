<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to JPG Converter — TallySync</title><meta name="description" content="Convert PDF pages to JPG images in your browser."><link rel="stylesheet" href="tool.css"></head><body><header class="nav"><div class="wrap"><a class="brand" href="index.html" aria-label="TallySync by Suman"><img class="brand-logo" src="tallysync-logo.png" alt="TallySync by Suman"></a><nav class="navlinks"><a href="all-tools.html">All Tools</a><a href="index.html#services">Services</a><a class="btn primary" href="index.html#converter">Bank Converter</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">PDF Tools</div><h1>PDF → JPG Converter</h1><p>Convert each PDF page into a downloadable JPG image locally in your browser.</p></section><section class="card"><input class="input" id="pdf" type="file" accept="application/pdf"><div class="actions"><button class="btn primary" onclick="go()">Convert PDF to JPG</button></div><div id="out" class="result"></div></section><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';window.go=async()=>{let f=document.getElementById('pdf').files[0];if(!f)return alert('Select a PDF');let pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,o=document.getElementById('out');o.innerHTML='';for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),v=p.getViewport({scale:1.7}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;let a=document.createElement('a');a.className='btn ghost';a.textContent='Download page '+i+' JPG';a.href=c.toDataURL('image/jpeg',.92);a.download=(f.name.replace(/\.pdf$/i,'')+'-page-'+i+'.jpg');a.style.margin='5px';o.appendChild(a)}};</script></main><footer class="footer">© 2026 TallySync by Suman · Browser-based accounting tools</footer><script src="tools.js"></script></body></html>
