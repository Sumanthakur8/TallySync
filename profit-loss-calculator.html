<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profit & Loss Calculator — TallySync</title><meta name="description" content="Calculate gross profit, operating profit and net profit."><link rel="stylesheet" href="tool.css"></head><body><header class="nav"><div class="wrap"><a class="brand" href="index.html">Tally<span>Sync</span> by Suman</a><nav class="navlinks"><a href="all-tools.html">All Tools</a><a href="index.html#services">Services</a><a class="btn primary" href="index.html#converter">Bank Converter</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">Business Tools</div><h1>Profit & Loss Calculator</h1><p>Enter revenue and expenses to estimate gross profit, operating profit and net profit.</p></section><section class="card"><div class="grid"><div class="field"><label>Sales / Revenue</label><input class="input" id="rev" type="number" value="1000000"></div><div class="field"><label>Cost of goods sold</label><input class="input" id="cogs" type="number" value="600000"></div><div class="field"><label>Operating expenses</label><input class="input" id="opex" type="number" value="200000"></div><div class="field"><label>Interest expense</label><input class="input" id="interest" type="number" value="30000"></div><div class="field"><label>Depreciation</label><input class="input" id="dep" type="number" value="20000"></div><div class="field"><label>Other income</label><input class="input" id="other" type="number" value="10000"></div><div class="field"><label>Tax expense</label><input class="input" id="tax" type="number" value="30000"></div></div><div class="actions"><button class="btn primary" onclick="calc()">Calculate P&L</button></div><div id="result" class="result"></div></section><script>function calc(){let rev=num('rev'),c=num('cogs'),o=num('opex'),i=num('interest'),d=num('dep'),other=num('other'),tax=num('tax'),gross=rev-c,ebit=gross-o-d,profit=ebit-i+other,net=profit-tax;document.getElementById('result').innerHTML='<div class="grid3"><div><small>Gross profit</small><div class="metric">'+money(gross)+'</div></div><div><small>Operating profit</small><div class="metric">'+money(ebit)+'</div></div><div><small>Net profit</small><div class="metric">'+money(net)+'</div></div></div><p class="muted">Gross margin: '+(rev?((gross/rev)*100).toFixed(2):0)+'% · Net margin: '+(rev?((net/rev)*100).toFixed(2):0)+'%</p></div>}calc();</script></main><footer class="footer">© 2026 TallySync by Suman · Browser-based accounting tools</footer><script src="tools.js"></script></body></html>
